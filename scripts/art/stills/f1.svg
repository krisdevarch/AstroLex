<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1920" viewBox="0 0 1080 1920">
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0a0c15"/><stop offset=".55" stop-color="#171a2e"/><stop offset="1" stop-color="#07080e"/></linearGradient>
<radialGradient id="haze" cx="540" cy="760" r="760" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#7070FF" stop-opacity=".55"/><stop offset=".5" stop-color="#4a4fb0" stop-opacity=".18"/><stop offset="1" stop-color="#4a4fb0" stop-opacity="0"/></radialGradient>
<linearGradient id="card" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#5b5f78"/><stop offset="1" stop-color="#3b3e54"/></linearGradient>
<linearGradient id="cardLit" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#9a9cff"/><stop offset="1" stop-color="#5557c9"/></linearGradient>
<linearGradient id="pic" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#7a7d98"/><stop offset="1" stop-color="#35384e"/></linearGradient>
<linearGradient id="fadeV" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#000" stop-opacity=".85"/><stop offset=".25" stop-color="#000" stop-opacity="0"/><stop offset=".75" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".9"/></linearGradient>
<radialGradient id="vig" cx="540" cy="900" r="1150" gradientUnits="userSpaceOnUse"><stop offset=".45" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".75"/></radialGradient>
<filter id="mb" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="2 26"/></filter>
<filter id="mb2" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="1 9"/></filter>
<filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="9"/></filter>
<filter id="soft2" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="28"/></filter>
<filter id="grain"><feTurbulence type="fractalNoise" baseFrequency=".8" numOctaves="2" seed="4"/><feColorMatrix values="0 0 0 0 .5  0 0 0 0 .5  0 0 0 0 .6  0 0 0 .09 0"/></filter>
<g id="cardA"><rect width="600" height="300" rx="26" fill="url(#card)"/><circle cx="62" cy="62" r="30" fill="#8d90ad"/><rect x="112" y="42" width="190" height="14" rx="7" fill="#a4a7c2"/><rect x="112" y="68" width="120" height="11" rx="5" fill="#74778f"/><rect x="40" y="120" width="520" height="12" rx="6" fill="#8a8da8"/><rect x="40" y="148" width="430" height="12" rx="6" fill="#7a7d98"/><rect x="40" y="176" width="480" height="12" rx="6" fill="#7a7d98"/><rect x="40" y="214" width="170" height="52" rx="14" fill="#2c2e42"/></g>
<g id="cardB"><rect width="600" height="420" rx="26" fill="url(#card)"/><circle cx="62" cy="58" r="28" fill="#8d90ad"/><rect x="108" y="40" width="170" height="14" rx="7" fill="#a4a7c2"/><rect x="30" y="104" width="540" height="240" rx="18" fill="url(#pic)"/><path d="M30 330 L170 220 L260 290 L360 190 L570 330 Z" fill="#2f3248" opacity=".75"/><circle cx="450" cy="170" r="30" fill="#b9bbd6" opacity=".6"/><rect x="30" y="366" width="360" height="12" rx="6" fill="#8a8da8"/></g>
<g id="cardC"><rect width="600" height="220" rx="26" fill="url(#cardLit)"/><circle cx="60" cy="60" r="26" fill="#d4d5ff"/><rect x="106" y="44" width="180" height="13" rx="6" fill="#e6e7ff"/><rect x="40" y="108" width="500" height="12" rx="6" fill="#cfd0ff"/><rect x="40" y="136" width="380" height="12" rx="6" fill="#bfc0ff"/><rect x="40" y="168" width="120" height="30" rx="14" fill="#4547a8"/></g>
<g id="body" fill="#0a0b14"><path d="M-20 1920 V1800 C-20 1745 90 1715 230 1695 C340 1680 440 1665 468 1628 L612 1628 C640 1665 740 1680 850 1695 C990 1715 1100 1745 1100 1800 V1920 Z"/><path d="M488 1560 H592 V1640 H488 Z"/><path d="M436 1470 C436 1385 480 1352 540 1352 C600 1352 644 1385 644 1470 C644 1540 600 1585 540 1585 C480 1585 436 1540 436 1470 Z" transform="rotate(-4 540 1470)"/></g>
</defs>
<rect width="1080" height="1920" fill="url(#bg)"/>
<rect width="1080" height="1920" fill="url(#haze)"/>

<!-- far columns, dim and blurred (background) -->
<g opacity=".5" filter="url(#mb)" transform="translate(-60 40) rotate(-6 200 900)">
<use href="#cardB" x="60" y="60"/><use href="#cardA" x="60" y="520"/><use href="#cardC" x="60" y="860"/><use href="#cardB" x="60" y="1120"/><use href="#cardA" x="60" y="1590"/>
</g>
<g opacity=".5" filter="url(#mb)" transform="translate(500 -60) rotate(5 800 900)">
<use href="#cardA" x="40" y="40"/><use href="#cardC" x="40" y="380"/><use href="#cardB" x="40" y="640"/><use href="#cardA" x="40" y="1110"/><use href="#cardB" x="40" y="1450"/>
</g>

<!-- central feed: streaks above/below, crisp near the focal band -->
<g transform="translate(240 0) rotate(-2.5 300 900)">
<g filter="url(#mb)" opacity=".9"><use href="#cardB" y="-120"/><use href="#cardA" y="330"/><use href="#cardC" y="1280"/><use href="#cardB" y="1530"/></g>
<g filter="url(#mb2)"><use href="#cardC" y="660"/></g>
<g><use href="#cardB" y="610"/><use href="#cardA" y="1060"/></g>
<g opacity=".28" filter="url(#mb)" transform="translate(0 -150)"><use href="#cardA" y="1060"/></g>
<g opacity=".22" filter="url(#mb)" transform="translate(0 170)"><use href="#cardB" y="610"/></g>
<rect x="-30" y="988" width="660" height="10" fill="#c8c9ff" opacity=".55" filter="url(#mb2)"/>
<rect x="-30" y="470" width="660" height="26" fill="#7070FF" opacity=".5" filter="url(#mb)"/>
</g>

<!-- streak lines -->
<g stroke="#9ea0ff" stroke-linecap="round" fill="none" filter="url(#mb2)">
<path d="M150 200 V520 M930 420 V820 M110 1100 V1400 M980 1000 V1330 M330 130 V330" stroke-width="5" opacity=".35"/>
</g>

<ellipse cx="540" cy="1380" rx="560" ry="260" fill="#7070FF" opacity=".28" filter="url(#soft2)"/>
<rect width="1080" height="1920" fill="url(#fadeV)"/>

<!-- foreground: viewer from behind, rim lit by the feed -->
<g id="viewer">
<g fill="#8f92ff" filter="url(#soft)" transform="translate(0 -16)" opacity="1"><use href="#body"/></g>
<use href="#body"/>
<path d="M437 1500 C428 1500 424 1525 436 1545 C444 1552 450 1544 450 1532 Z" fill="#11132a"/>
<path d="M643 1500 C652 1500 656 1525 644 1545 C636 1552 630 1544 630 1532 Z" fill="#11132a"/>
<path d="M452 1440 C470 1368 610 1368 628 1440 C606 1404 474 1404 452 1440 Z" fill="#2b3070" opacity=".3"/>
<path d="M490 1612 C500 1650 480 1668 430 1690 M590 1612 C580 1650 600 1668 650 1690" stroke="#1a1d3a" stroke-width="5" fill="none"/>
<path d="M170 1760 C260 1700 380 1680 470 1665 M910 1760 C820 1700 700 1680 610 1665" stroke="#8588ff" stroke-width="3" fill="none" opacity=".55" filter="url(#mb2)"/>
</g>
<rect width="1080" height="1920" fill="url(#vig)"/>
<rect width="1080" height="1920" filter="url(#grain)"/>
</svg>
