<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1920" viewBox="0 0 1080 1920">
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#07080e"/><stop offset=".6" stop-color="#141728"/><stop offset="1" stop-color="#0b0c16"/></linearGradient>
<radialGradient id="spill" cx="820" cy="1250" r="900" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#7070FF" stop-opacity=".6"/><stop offset=".45" stop-color="#4b4fb8" stop-opacity=".2"/><stop offset="1" stop-color="#4b4fb8" stop-opacity="0"/></radialGradient>
<linearGradient id="skin" x1="660" y1="1060" x2="330" y2="620" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#c4c6ff"/><stop offset=".35" stop-color="#8c90cf"/><stop offset=".75" stop-color="#3a3d63"/><stop offset="1" stop-color="#1c1e35"/></linearGradient>
<linearGradient id="hood" x1="800" y1="1250" x2="200" y2="1500" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#565aa8"/><stop offset=".4" stop-color="#2a2d52"/><stop offset="1" stop-color="#0f1020"/></linearGradient>
<linearGradient id="screen" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#dcdcff"/><stop offset=".5" stop-color="#a0a2ff"/><stop offset="1" stop-color="#6366f0"/></linearGradient>
