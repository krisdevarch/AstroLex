<filter id="grain"><feTurbulence type="fractalNoise" baseFrequency=".8" numOctaves="2" seed="9"/><feColorMatrix values="0 0 0 0 .5  0 0 0 0 .5  0 0 0 0 .6  0 0 0 .09 0"/></filter>
<path id="head" d="M338 1040 C246 968 212 790 290 668 C372 556 524 546 586 634 C606 662 616 690 621 722 C619 736 613 744 612 752 L668 832 C666 846 650 852 631 857 C640 870 646 882 641 892 C634 897 626 899 619 901 C632 908 643 922 638 936 C632 946 622 951 615 960 C620 972 610 992 584 1006 C556 1022 522 1034 492 1046 L478 1140 L338 1140 Z"/>
