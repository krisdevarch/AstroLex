<g transform="translate(572 880) rotate(-30)">
<path d="M10 70 L60 70 L70 150 L-10 150 Z" fill="#3a3e72"/>
<path d="M20 -42 L-44 -30 C-52 -18 -50 -8 -50 -2 L-72 30 C-70 38 -60 40 -50 40 C-53 52 -53 56 -50 62 C-52 70 -48 78 -44 84 C-36 100 -20 106 0 108 L46 110 L56 -20 Z" fill="url(#face)"/>
<path d="M-50 -2 L-72 30 C-70 38 -60 40 -50 40" stroke="#e8e9ff" stroke-width="4" fill="none" opacity=".85" filter="url(#b3)"/>
<path d="M-44 84 C-36 100 -20 106 0 108" stroke="#e8e9ff" stroke-width="5" fill="none" opacity=".8" filter="url(#b3)"/>
<path d="M-44 -26 C-30 -22 -14 -22 0 -26" stroke="#0a0b16" stroke-width="7" stroke-linecap="round" fill="none"/>
<path d="M-28 -8 C-20 -4 -10 -4 -2 -8" stroke="#0a0b16" stroke-width="5" stroke-linecap="round" fill="none"/>
<path d="M-52 62 C-40 64 -26 62 -18 60" stroke="#2b2e52" stroke-width="3" fill="none"/>
