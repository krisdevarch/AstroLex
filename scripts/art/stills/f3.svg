<g transform="rotate(-14 498 1070)">
<rect x="450" y="1005" width="92" height="150" rx="14" fill="#0b0c18"/>
<rect x="457" y="1012" width="78" height="136" rx="9" fill="#d8d9ff"/>
<rect x="463" y="1024" width="40" height="12" rx="4" fill="#7a7dff" opacity=".8"/>
<rect x="463" y="1046" width="62" height="38" rx="5" fill="#9fa1ff" opacity=".9"/>
<rect x="463" y="1096" width="60" height="7" rx="3" fill="#8a8dff" opacity=".8"/>
<rect x="463" y="1112" width="44" height="7" rx="3" fill="#8a8dff" opacity=".8"/>
</g>
<!-- thumbs and fingers -->
<path d="M470 1118 C456 1126 454 1148 474 1150 C490 1150 500 1140 500 1130 Z" fill="#a9acf4"/>
<path d="M530 1126 C548 1130 556 1148 540 1156 C524 1160 512 1148 516 1134 Z" fill="#8a8ee0"/>
<path d="M446 1040 C428 1048 430 1080 448 1090 C456 1088 456 1060 456 1046 Z" fill="#c4c6ff"/>
<path d="M440 1070 C432 1084 440 1100 454 1096" stroke="#2b2e55" stroke-width="3" fill="none"/>

<!-- phone light over everything -->
<rect width="1080" height="1920" fill="url(#phoneGlow)"/>
<ellipse cx="490" cy="1060" rx="150" ry="150" fill="#7070FF" opacity=".25" filter="url(#b30)"/>

<!-- floating ash -->
<g fill="#b7bbff" opacity=".35"><circle cx="150" cy="1300" r="3"/><circle cx="330" cy="1480" r="2.5"/><circle cx="870" cy="1350" r="3"/><circle cx="940" cy="1520" r="2"/><circle cx="780" cy="720" r="2.5"/><circle cx="420" cy="760" r="2"/><circle cx="220" cy="1100" r="2"/><circle cx="700" cy="1480" r="2.5"/></g>

<!-- foreground rubble (out of focus) -->
<g filter="url(#b3)">
<path d="M-20 1920 L-20 1780 L90 1740 L170 1790 L260 1760 L330 1830 L420 1920 Z" fill="#06070d"/>
<path d="M700 1920 L760 1830 L860 1810 L930 1760 L1010 1800 L1100 1770 L1100 1920 Z" fill="#06070d"/>
