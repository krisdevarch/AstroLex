<path fill="url(#mid)" d="M780 1190 L780 900 L830 920 L850 850 L930 890 L960 840 L1100 880 L1100 1190 Z" opacity=".95"/>
<g fill="#0a0b14"><rect x="808" y="960" width="44" height="60"/><rect x="880" y="960" width="44" height="60"/><rect x="956" y="950" width="44" height="60"/><rect x="808" y="1060" width="44" height="60"/><rect x="956" y="1050" width="44" height="60"/></g>
