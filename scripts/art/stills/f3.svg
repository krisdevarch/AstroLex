<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1920" viewBox="0 0 1080 1920">
<defs>
<linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#14162a"/><stop offset=".5" stop-color="#2b2f4c"/><stop offset="1" stop-color="#5b6088"/></linearGradient>
<linearGradient id="ground" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#4a4e72"/><stop offset=".15" stop-color="#2a2d48"/><stop offset="1" stop-color="#0c0d18"/></linearGradient>
<linearGradient id="far" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3a3e60"/><stop offset="1" stop-color="#555a82"/></linearGradient>
<linearGradient id="mid" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#171929"/><stop offset="1" stop-color="#2b2e4a"/></linearGradient>
<linearGradient id="face" x1="-60" y1="110" x2="40" y2="-60" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#d4d5ff"/><stop offset=".4" stop-color="#8e92d4"/><stop offset="1" stop-color="#2b2e50"/></linearGradient>
<linearGradient id="jacket" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#6a6eb8"/><stop offset=".3" stop-color="#2f3254"/><stop offset="1" stop-color="#121424"/></linearGradient>
<linearGradient id="pants" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#454a82"/><stop offset=".4" stop-color="#22253f"/><stop offset="1" stop-color="#101120"/></linearGradient>
<linearGradient id="helm" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#4a4e86"/><stop offset=".5" stop-color="#232644"/><stop offset="1" stop-color="#0f1020"/></linearGradient>
<radialGradient id="phoneGlow" cx="500" cy="1070" r="420" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#8c8eff" stop-opacity=".8"/><stop offset=".4" stop-color="#7070FF" stop-opacity=".25"/><stop offset="1" stop-color="#7070FF" stop-opacity="0"/></radialGradient>
<radialGradient id="vig" cx="540" cy="1000" r="1100" gradientUnits="userSpaceOnUse"><stop offset=".5" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".7"/></radialGradient>
<linearGradient id="haze" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#8a8fc0" stop-opacity="0"/><stop offset="1" stop-color="#8a8fc0" stop-opacity=".45"/></linearGradient>
<filter id="b3"><feGaussianBlur stdDeviation="3"/></filter>
<filter id="b6"><feGaussianBlur stdDeviation="6"/></filter>
<filter id="b14" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="14"/></filter>
<filter id="b30" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="30"/></filter>
<filter id="grain"><feTurbulence type="fractalNoise" baseFrequency=".8" numOctaves="2" seed="13"/><feColorMatrix values="0 0 0 0 .5  0 0 0 0 .5  0 0 0 0 .6  0 0 0 .09 0"/></filter>
</defs>
<rect width="1080" height="1920" fill="url(#sky)"/>
<!-- smoke columns, distant -->
<g filter="url(#b30)" opacity=".5"><path d="M300 1000 C260 800 360 640 300 420 C380 600 330 800 360 1000 Z" fill="#6b7099"/><path d="M850 980 C830 820 900 700 860 540 C920 700 890 820 900 980 Z" fill="#6b7099"/></g>
<!-- far skyline -->
<path fill="url(#far)" d="M-20 1160 L-20 980 L80 960 L90 900 L160 905 L170 850 L230 880 L240 940 L330 930 L340 870 L410 890 L420 1000 L520 990 L530 920 L610 940 L620 1010 L700 1000 L710 940 L800 960 L810 1020 L900 1010 L910 930 L1000 950 L1100 980 L1100 1160 Z" opacity=".85"/>
<g fill="#2e3250" opacity=".6"><rect x="110" y="950" width="22" height="30"/><rect x="190" y="900" width="22" height="30"/><rect x="360" y="930" width="22" height="30"/><rect x="560" y="965" width="22" height="30"/><rect x="740" y="990" width="22" height="30"/><rect x="930" y="975" width="22" height="30"/></g>
<rect y="880" width="1080" height="300" fill="url(#haze)"/>
