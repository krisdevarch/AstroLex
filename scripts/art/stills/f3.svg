<path d="M-50 -66 C-30 -118 20 -134 60 -128" stroke="#a0a4ff" stroke-width="5" fill="none" opacity=".6" filter="url(#b3)"/>
<path d="M30 52 C20 80 0 100 -20 108" stroke="#0b0c16" stroke-width="5" fill="none" opacity=".9"/>
</g>
<!-- near arm: upper arm and forearm to the phone -->
<path d="M650 1010 C690 1100 680 1150 600 1140 L520 1090" stroke="#2c2f5a" stroke-width="72" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
<path d="M650 1010 C690 1100 680 1150 600 1140" stroke="#7a7ee6" stroke-width="5" fill="none" opacity=".4" filter="url(#b3)" transform="translate(-30 -6)"/>
