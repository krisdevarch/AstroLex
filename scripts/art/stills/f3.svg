<path d="M860 1810 L930 1760 L1010 1800" stroke="#7a7eff" stroke-width="3" fill="none" opacity=".35"/>
</g>
<rect width="1080" height="1920" fill="url(#vig)"/>
<rect width="1080" height="1920" filter="url(#grain)"/>
</svg>
