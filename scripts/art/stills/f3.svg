<g fill="#07080f"><rect x="20" y="640" width="70" height="100"/><rect x="130" y="640" width="70" height="100"/><rect x="20" y="800" width="70" height="100"/><rect x="130" y="800" width="70" height="100"/><rect x="20" y="960" width="70" height="100"/><rect x="130" y="960" width="70" height="100"/><rect x="236" y="800" width="60" height="90"/></g>
<path d="M-20 520 L70 570 L90 480 L170 540 L200 470 L270 610" stroke="#8a8fff" stroke-width="3" fill="none" opacity=".25"/>
<path d="M-20 1000 L340 960 M-20 1090 L340 1060" stroke="#0a0b14" stroke-width="14" opacity=".8"/>
<!-- ground, street receding to the left -->
<path fill="url(#ground)" d="M-20 1180 L1100 1180 L1100 1920 L-20 1920 Z"/>
<g stroke="#6c71a8" stroke-width="2" fill="none" opacity=".25"><path d="M240 1180 L-300 1920 M240 1180 L40 1920 M240 1180 L360 1920 M240 1180 L700 1920 M240 1180 L1200 1760"/><path d="M0 1300 L1080 1290 M0 1450 L1080 1440"/></g>
<!-- curb at the edge -->
<path d="M0 1690 L1080 1650 L1080 1720 L0 1770 Z" fill="#32365a"/>
<path d="M0 1690 L1080 1650" stroke="#9a9dff" stroke-width="3" opacity=".35"/>

<!-- cast glow of the phone on the ground and body -->
<ellipse cx="520" cy="1700" rx="260" ry="40" fill="#7070FF" opacity=".25" filter="url(#b14)"/>
<ellipse cx="640" cy="1700" rx="170" ry="20" fill="#000" opacity=".6" filter="url(#b6)"/>

<!-- ============ SOLDIER ============ -->
<!-- rifle slung on the back (behind torso) -->
<g>
<path d="M740 1240 L780 800 L792 802 L752 1244 Z" fill="#0d0e1a"/>
<path d="M730 1300 L742 1180 L772 1186 L762 1306 Z" fill="#0d0e1a"/>
