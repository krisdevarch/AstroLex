<defs>
<linearGradient id="wall" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#16182a"/><stop offset="1" stop-color="#2b2e48"/></linearGradient>
<linearGradient id="floor" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1d2036"/><stop offset=".3" stop-color="#14162a"/><stop offset="1" stop-color="#090a13"/></linearGradient>
<linearGradient id="beam" x1="390" y1="740" x2="740" y2="1330" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#c9caff" stop-opacity=".55"/><stop offset=".6" stop-color="#9ea1f5" stop-opacity=".26"/><stop offset="1" stop-color="#9ea1f5" stop-opacity=".16"/></linearGradient>
