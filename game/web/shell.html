/* All sizes below are in design units u = stage width / 1080, the same units game/scenes/intro_screen.gd
   uses, so the overlay and the Godot intro put the button and the bar in the same place. */
#bar {
	display: none;
	position: absolute;
	left: 50%;
	bottom: calc(var(--u) * 370);
	width: calc(var(--u) * 560);
	height: calc(var(--u) * 560 * 94 / 773);
	transform: translateX(-50%);
	filter: drop-shadow(0 calc(var(--u) * 6) calc(var(--u) * 10) rgba(0, 3, 14, 0.5));
}

#bar > svg {
	display: block;
	width: 100%;
	height: 100%;
	overflow: visible;
}

#status-percent {
	position: absolute;
	right: calc(var(--u) * 560 * 36 / 773);
	top: 0;
	bottom: 0;
	display: flex;
	align-items: center;
	font-size: calc(var(--u) * 27);
	color: #fff;
	letter-spacing: 0.03em;
	text-shadow: 0 1px 4px rgba(5, 8, 20, 0.95);
}

/* The intro's "Tap to start" in its disabled look (ui.gd primary, "disabled"): same size and place as the
   Godot button, which takes over from this overlay once the engine is up. */
#btn {
	position: absolute;
	left: 50%;
	bottom: calc(var(--u) * 180);
	width: calc(var(--u) * 600);
	height: calc(var(--u) * 150);
	transform: translateX(-50%);
	box-sizing: border-box;
	border-radius: calc(var(--u) * 75);
	background: #736b61;
	border-bottom: calc(var(--u) * 10) solid #9c540c;
	color: #333340;
	display: flex;
	align-items: center;
	justify-content: center;
	padding-bottom: calc(var(--u) * 10);
	font-size: calc(var(--u) * 62);
	line-height: 1;
	white-space: nowrap;
}

#stage.notice #btn, #stage.notice #bar {
	display: none;
}

#status-notice {
	display: none;
	position: absolute;
	left: 0;
	right: 0;
	bottom: calc(var(--u) * 200);
	background-color: #5b3943;
	border-radius: 0.5rem;
	border: 1px solid #9b3943;
	color: #e0e0e0;
	font-family: 'Noto Sans', 'Droid Sans', Arial, sans-serif;
	font-weight: 400;
	line-height: 1.3;
	margin: 0 2rem;
	overflow: hidden;
	padding: 1rem;
	text-align: center;
	z-index: 1;
}

/* Shown when the browser drops the game's graphics (WebGL context lost, WP-F.16). */
#lost {
	position: fixed;
	inset: 0;
	z-index: 20;
	display: none;
	flex-direction: column;
	align-items: center;
	justify-content: center;
	gap: 24px;
	padding: 0 32px;
	background: rgba(5, 8, 20, 0.92);
	color: #efe8d6;
	text-align: center;
	font-family: 'Fredoka', 'Arial Rounded MT Bold', 'Nunito', ui-rounded, system-ui, sans-serif;
	font-weight: 600;
	font-size: 20px;
	line-height: 1.4;
}

#lost.on {
	display: flex;
}

#lost button {
	font: inherit;
	padding: 12px 36px;
	border: 0;
	border-radius: 999px;
	background: #ff9a3d;
	color: #1b2333;
}

#lost-btns {
	display: flex;
	flex-direction: column;
	gap: 14px;
	align-items: center;
}

#lost-btns.off {
	display: none;
}

#lost button.alt {
	background: transparent;
	color: #efe8d6;
	box-shadow: inset 0 0 0 2px rgba(239, 232, 214, 0.5);
	padding: 10px 28px;
	font-size: 17px;
}

@media (prefers-reduced-motion: reduce) {
	#status { transition-duration: 0.01s; }
}

						<path d="M57,20 H727" stroke="#4d79a9" stroke-width="2" opacity="0.5"/>
						<rect x="2" y="22" width="15" height="52" rx="5" fill="#34507e" stroke="#04071a" stroke-width="3"/>
						<circle cx="9" cy="36" r="3" fill="#9fc0e0"/><circle cx="9" cy="60" r="3" fill="#9fc0e0"/>
						<svg id="liquid" x="25" y="16" width="734" height="62" viewBox="0 0 734 62"></svg>
					</svg>
					<div id="status-percent"></div>
				</div>
				<div id="btn">Tap to start</div>
				<div id="status-notice"></div>
			</div>

		<div id="lost">
			<div id="lost-msg">The browser reset the game's graphics.<br>Your progress is saved.</div>
			<div id="lost-btns">
				<button type="button" id="lost-reload">Reload</button>
				<button type="button" id="lost-report" class="alt">Report a problem</button>
				<button type="button" id="lost-copy" class="alt">Copy report</button>
			</div>

		<script>
// Lifecycle log, crash detection and automatic recovery (WP-F.20). Runs before the engine script so
// requestAnimationFrame can be wrapped and the engine's WebGL alert intercepted.
(function () {
	'use strict';
	const LOG_CAP = 80;
	const T0 = performance.now();
	const log = [];
	window.__alxLog = log;
	let started = false;
	let lost = false;
	let lostCount = 0;
	let lastRaf = performance.now();
	let recovering = false;
	let deadShown = false;
	let stalled = false;

	function ls(fn) {
		try { return fn(window.localStorage); } catch (e) { return null; }
	}
	function ss(fn) {
		try { return fn(window.sessionStorage); } catch (e) { return null; }
	}
	ls((s) => {
		const old = s.getItem('alx_log');
		if (old !== null) { s.setItem('alx_prev_log', old); }
	});
	// Writes are batched (a blur/focus or error storm must not hit storage every frame) and
	// flushed at once when the page is hidden or closed.
	let flushTimer = 0;
	function flush() {
		clearTimeout(flushTimer);
		flushTimer = 0;
		ls((s) => s.setItem('alx_log', JSON.stringify(log)));
	}
	function note(ev) {
		log.push({ t: Math.round((performance.now() - T0) / 100) / 10, ev: String(ev) });
		if (log.length > LOG_CAP) { log.splice(0, log.length - LOG_CAP); }
		if (!flushTimer) { flushTimer = setTimeout(flush, 250); }
	}
	window.__alxNote = note;
	note('boot');

	// Watchdog stamp: every animation-frame callback records the time.
	const nativeRaf = window.requestAnimationFrame.bind(window);
	window.requestAnimationFrame = function (cb) {
		return nativeRaf(function (ts) {
			lastRaf = performance.now();
			if (stalled) { unstall(); }
			return cb(ts);
		});
	};
	function resetStamp() { lastRaf = performance.now(); }

	document.addEventListener('visibilitychange', () => {
		note(document.visibilityState === 'hidden' ? 'visibility hidden' : 'visibility visible');
		if (document.visibilityState === 'hidden') { flush(); }
		if (document.visibilityState === 'visible') {
			resetStamp();
			if (pendingRecover) { recover(); }
		}
	});
	document.addEventListener('freeze', () => note('freeze'));
	document.addEventListener('resume', () => { note('resume'); resetStamp(); });
	window.addEventListener('pagehide', (e) => { note('pagehide persisted=' + !!e.persisted); flush(); });
	window.addEventListener('pageshow', (e) => { note('pageshow persisted=' + !!e.persisted); resetStamp(); });
	window.addEventListener('blur', () => note('blur'));
	window.addEventListener('focus', () => note('focus'));

	const canvas = document.getElementById('canvas');
	canvas.addEventListener('webglcontextlost', () => {
		lost = true;
		lostCount += 1;
		note('webglcontextlost');
		recover();
	});
	canvas.addEventListener('webglcontextrestored', () => { lost = false; note('webglcontextrestored'); });

	const box = document.getElementById('lost');
	const msg = document.getElementById('lost-msg');
	const btns = document.getElementById('lost-btns');
	function showNotice(text, withButtons) {
		msg.innerHTML = text;
		btns.classList.toggle('off', !withButtons);
		box.classList.add('on');
	}

	// Automatic recovery from a lost context: reload (now if visible, else when the player returns),
	// unless that has already happened 3 times in the last 2 minutes.
	let pendingRecover = false;
	function recover() {
		if (recovering) { return; }
		const now = Date.now();
		let stamps = [];
		ss((s) => { stamps = JSON.parse(s.getItem('alx_recover_ts') || '[]').filter((x) => now - x < 120000); });
		if (stamps.length >= 3) {
			note('recovery loop guard');
			showNotice('The browser reset the game\'s graphics.<br>Your progress is saved.', true);
			return;
		}
		showNotice('Restoring your game…', false);
		if (document.visibilityState !== 'visible') {
			pendingRecover = true;
			note('recovery waits for visible');
			return;
		}
		recovering = true;
		pendingRecover = false;
		stamps.push(now);
		ss((s) => { s.setItem('alx_recover', '1'); s.setItem('alx_recover_ts', JSON.stringify(stamps)); });
		note('recovery reload');
		window.location.reload();
	}

	function dead(why) {
		if (deadShown || recovering) { return; }
		deadShown = true;
		note(why);
		flush();
		showNotice('The game stopped responding.<br>Your progress is saved.', true);
	}
	// A long frame (a slow level load) that ends after the notice went up: frames are back, take it down.
	function unstall() {
		stalled = false;
		if (!deadShown) { return; }
		deadShown = false;
		note('stall recovered');
		box.classList.remove('on');
	}

	const nativeAlert = window.alert.bind(window);
	window.alert = function (m) {
		if (/WebGL context lost/i.test(String(m))) {
			console.error('AstroLex: WebGL context lost');
			note('alert intercepted: WebGL context lost');
			if (!recovering && !deadShown) { lost = true; recover(); }
			return;
		}
		nativeAlert(m);
	};

	// A wasm crash. Not "AbortError" (an interrupted play() or fetch), which is harmless.
	const ABORT = /Aborted\(|RuntimeError|[Oo]ut of memory|unreachable/;
	window.addEventListener('error', (e) => {
		const m = String(e.message || (e.error && e.error.message) || '');
		note('error ' + m.slice(0, 120));
		if (started && ABORT.test(m)) { dead('abort: ' + m.slice(0, 60)); }
	});
	window.addEventListener('unhandledrejection', (e) => {
		const r = e.reason;
		const m = String((r && r.message) || r || '');
		note('unhandledrejection ' + m.slice(0, 120));
		if (started && ABORT.test(m)) { dead('abort: ' + m.slice(0, 60)); }
	});

	window.__alxStarted = function () {
		started = true;
		note('engine started');
		resetStamp();
		gpu();
		// The page's own recovery flag is read by the game at start; never let a stale one linger.
		setTimeout(() => ss((s) => s.removeItem('alx_recover')), 10000);
		// Two stale checks in a row: after one long blocking frame the timer can run before the next
		// animation frame does.
		let staleTicks = 0;
		setInterval(() => {
			const stale = document.visibilityState === 'visible' && performance.now() - lastRaf > 5000;
			staleTicks = stale ? staleTicks + 1 : 0;
			if (staleTicks >= 2 && !deadShown) {
				stalled = true;
				dead('stall');
			}
		}, 1000);
	};

	let renderer = null;
	function gpu() {
		if (renderer) { return renderer; }
		renderer = { renderer: 'unknown', version: 'unknown' };
		try {
			// The game's own context (asking again returns it); a new context could evict the game's.
			const gl = canvas.getContext('webgl2') || canvas.getContext('webgl');
			if (gl) {
				renderer.version = String(gl.getParameter(gl.VERSION));
				const ext = gl.getExtension('WEBGL_debug_renderer_info');
				renderer.renderer = String(ext ? gl.getParameter(ext.UNMASKED_RENDERER_WEBGL) : gl.getParameter(gl.RENDERER));
			}
		} catch (e) { /* keep unknown */ }
		return renderer;
	}
	function readLog(key) {
		return ls((s) => JSON.parse(s.getItem(key) || 'null')) || [];
	}
	window.alxReport = function () {
		const g = gpu();
		const real = window.__alxRealDpr ? window.__alxRealDpr() : window.devicePixelRatio;
		const out = {
			webgl: { renderer: g.renderer, version: g.version, lost: lost, lost_count: lostCount },
			log: log.slice(),
			prev_log: readLog('alx_prev_log'),
			dpr: { real: real, capped: window.devicePixelRatio },
			ua: navigator.userAgent,
			visibility: document.visibilityState,
		};
		if (performance.memory) {
			out.memory = {
				used_mb: Math.round(performance.memory.usedJSHeapSize / 1048576),
				total_mb: Math.round(performance.memory.totalJSHeapSize / 1048576),
				limit_mb: Math.round(performance.memory.jsHeapSizeLimit / 1048576),
			};
		}
		return JSON.stringify(out);
	};

	function reportMarkdown(maxUrl) {
		const r = JSON.parse(window.alxReport());
		const base = 'https://github.com/krisdevarch/AstroLex/issues/new?labels=bug&title=';
		const title = '[bug] Game stopped or lost graphics';
		function build() {
			const summary = 'Page report: ' + r.webgl.renderer + ', context lost=' + r.webgl.lost + ' (' + r.webgl.lost_count + '), '
				+ r.visibility + ', dpr ' + r.dpr.real + '/' + r.dpr.capped + '.';
			return summary + '\n\n```json\n' + JSON.stringify(r, null, 1) + '\n```\n';
		}
		let body = build();
		const url = () => base + encodeURIComponent(title) + '&body=' + encodeURIComponent(body);
		if (maxUrl) {
			r.prev_log = [];
			body = build();
			while (url().length > maxUrl && r.log.length > 1) {
				r.log.splice(0, Math.max(1, Math.floor(r.log.length / 4)));
				body = build();
			}
			return { url: url(), body: body };
		}
		return { url: url(), body: body };
	}
	function fullThenTrim() {
		const full = reportMarkdown(0);
		const trimmed = full.url.length <= 6000 ? full : reportMarkdown(6000);
		return { url: trimmed.url, body: full.body };
	}
	document.getElementById('lost-reload').addEventListener('click', () => {
		ss((s) => s.setItem('alx_recover', '1'));
		note('manual reload');
		window.location.reload();
	});
	document.getElementById('lost-report').addEventListener('click', () => {
		window.open(fullThenTrim().url, '_blank', 'noopener');
	});
	document.getElementById('lost-copy').addEventListener('click', () => {
		const text = fullThenTrim().body;
		const fallback = () => {
			const ta = document.createElement('textarea');
			ta.value = text;
			ta.style.position = 'fixed';
			ta.style.opacity = '0';
			document.body.appendChild(ta);
			ta.select();
			try { document.execCommand('copy'); } catch (e) { /* ignore */ }
			ta.remove();
		};
		if (navigator.clipboard && navigator.clipboard.writeText) {
			navigator.clipboard.writeText(text).catch(fallback);
		} else {
			fallback();
		}
	});
}());
		</script>

		<script>
// Phone heat (WP-F.16): Godot sizes the canvas by window.devicePixelRatio, so a 3x phone draws
// 2.25 times the pixels of a 2x one, every frame, for little visible gain. Cap the ratio at 2;
// ?dpr=<n> sets another cap for testing.
(function () {
	const q = Number(new URLSearchParams(window.location.search).get('dpr'));
	const cap = q > 0 ? q : 2;
	const own = Object.getOwnPropertyDescriptor(window, 'devicePixelRatio')
		|| Object.getOwnPropertyDescriptor(Window.prototype, 'devicePixelRatio');
	if (!own) {
		return;
	}
	const real = own.get ? () => own.get.call(window) : () => own.value;
	window.__alxRealDpr = real;
	try {
		Object.defineProperty(window, 'devicePixelRatio', { configurable: true, get: () => Math.min(cap, real() || 1) });
	} catch (err) {
		console.warn('AstroLex: pixel ratio cap not applied', err);
	}
}());

// The load bar: the play screen's clock liquid (HudArt.Liquid) in the clock bar's frame, drawn into the
// SVG made by make_loading.py. Coral to peach, a rolling wave with a pale crest, small bubbles; still
// under prefers-reduced-motion. window.__alxLoad(share) sets the target (-1 = size unknown).
(function () {
	const svg = document.getElementById('liquid');
	if (!svg) { return; }
	const NS = 'http://www.w3.org/2000/svg';
	const W = 734, H = 62, PAD = 4.5;
	const h = H - PAD * 2, full = W - PAD * 2, r = h / 2;
	const calm = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
	const mk = (tag, attrs) => {
		const e = document.createElementNS(NS, tag);
		for (const k in attrs) { e.setAttribute(k, attrs[k]); }
		svg.appendChild(e);
		return e;
	};
	const body = mk('path', { fill: 'url(#liq)' });
	const crest = mk('path', { fill: 'none', stroke: 'rgba(255,230,209,.75)', 'stroke-width': 4, 'stroke-linejoin': 'round' });
	const dots = [];
	for (let i = 0; i < 9; i++) { dots.push(mk('circle', { r: i < 7 ? 2.5 + (i % 3) * 1.5 : 3.5, fill: 'rgb(255,219,214)' })); }
	let target = 0, shown = 0, t = 0, last = performance.now();
	const surf = (x, ph) => PAD + 0.34 * h + 0.24 * h * Math.sin(x / 48 + ph);
	const frac = (v) => v - Math.floor(v);
	function draw() {
		const ph = calm ? 0 : t * 1.3;
		const front = PAD + Math.max(r * 1.2, full * shown);
		const corner = 7;
		const steps = Math.max(2, Math.floor((front - corner - PAD) / 6));
		const cap = (x) => { const dx = PAD + r - x; return x < PAD + r ? Math.sqrt(Math.max(0, r * r - dx * dx)) : r; };
		const top = [];
		for (let i = 0; i <= steps; i++) {
			const x = PAD + (front - corner - PAD) * i / steps, c = cap(x);
			top.push([x, Math.min(Math.max(surf(x, ph), PAD + r - c), PAD + r + c * 0.6)]);
		}
		const pts = top.slice();
		pts.push([front, top[top.length - 1][1] + corner], [front, PAD + h]);
		for (let i = 0; i < steps; i++) {
			const x = front - corner + (PAD - front + corner) * i / steps;
			pts.push([x, PAD + r + cap(x)]);
		}
		const f = (p) => p[0].toFixed(1) + ',' + p[1].toFixed(1);
		body.setAttribute('d', 'M' + pts.map(f).join('L') + 'Z');
		crest.setAttribute('d', 'M' + top.map((p) => f([p[0], p[1] + 3])).join('L'));
		for (let i = 0; i < 7; i++) {
			const bx = PAD + r * 0.6 + ((i * 113 + (calm ? 0 : t * (9 + i * 3))) % Math.max(1, front - PAD - r));
			const rise = calm ? 0.5 : frac(i * 0.31 + t * (0.18 + 0.04 * i));
			const by = (PAD + h - 6) + (surf(bx, ph) + 6 - (PAD + h - 6)) * rise;
			dots[i].setAttribute('cx', bx.toFixed(1)); dots[i].setAttribute('cy', by.toFixed(1));
			dots[i].setAttribute('opacity', 0.7);
		}
		for (let i = 0; i < 2; i++) {
			const dx = PAD + front * (0.25 + 0.45 * i);
			const hop = calm ? 0 : Math.max(0, Math.sin(t * 1.4 + i * 2));
			dots[7 + i].setAttribute('cx', dx.toFixed(1));
			dots[7 + i].setAttribute('cy', (surf(dx, ph) - 5 - 10 * hop).toFixed(1));
			dots[7 + i].setAttribute('opacity', 0.65 * (0.4 + 0.6 * hop));
		}
	}
	function frame(now) {
		const dt = Math.min(0.1, (now - last) / 1000);
		last = now;
		t += dt;
		if (target < 0) { shown = Math.min(0.9, shown + (0.9 - shown) * dt * 0.25); }
		else { shown += (target - shown) * Math.min(1, dt * 6); }
		draw();
		if (document.getElementById('liquid')) { requestAnimationFrame(frame); }
	}
	window.__alxLoad = (share) => { target = share; };
	draw();
	requestAnimationFrame(frame);
}());

const GODOT_CONFIG = $GODOT_CONFIG;
const GODOT_THREADS_ENABLED = $GODOT_THREADS_ENABLED;
const engine = new Engine(GODOT_CONFIG);

(function () {
	const statusOverlay = document.getElementById('status');
	const statusStage = document.getElementById('stage');
	const statusBar = document.getElementById('bar');
	const statusPercent = document.getElementById('status-percent');
	const statusNotice = document.getElementById('status-notice');

	let initializing = true;
	let statusMode = '';

	function setStatusMode(mode) {
		if (statusMode === mode || !initializing) {
			return;
		}
		if (mode === 'hidden') {
			// Hand-off: the Godot intro (same art, button enabled) is already drawn under this overlay.
			initializing = false;
			statusMode = mode;
			requestAnimationFrame(() => requestAnimationFrame(() => {
				statusOverlay.classList.add('fade');
				const remove = () => statusOverlay.remove();
				statusOverlay.addEventListener('transitionend', remove, { once: true });
				setTimeout(remove, 900);
			}));
			return;
		}
		statusOverlay.style.visibility = 'visible';
		statusBar.style.display = mode === 'progress' ? 'block' : 'none';
		statusStage.classList.toggle('notice', mode === 'notice');
		statusNotice.style.display = mode === 'notice' ? 'block' : 'none';
		statusMode = mode;
	}

	function setStatusNotice(text) {
		while (statusNotice.lastChild) {
			statusNotice.removeChild(statusNotice.lastChild);
		}
		const lines = text.split('\n');
		lines.forEach((line) => {
			statusNotice.appendChild(document.createTextNode(line));
			statusNotice.appendChild(document.createElement('br'));
		});
	}

	function displayFailureNotice(err) {
		console.error(err);
		if (err instanceof Error) {
			setStatusNotice(err.message);
		} else if (typeof err === 'string') {
			setStatusNotice(err);
		} else {
			setStatusNotice('An unknown error occurred.');
		}
		setStatusMode('notice');
		initializing = false;
	}

	const missing = Engine.getMissingFeatures({
		threads: GODOT_THREADS_ENABLED,
	});

	if (missing.length !== 0) {
		if (GODOT_CONFIG['serviceWorker'] && GODOT_CONFIG['ensureCrossOriginIsolationHeaders'] && 'serviceWorker' in navigator) {
			let serviceWorkerRegistrationPromise;
			try {
				serviceWorkerRegistrationPromise = navigator.serviceWorker.getRegistration();
			} catch (err) {
				serviceWorkerRegistrationPromise = Promise.reject(new Error('Service worker registration failed.'));
			}
			// There's a chance that installing the service worker would fix the issue
			Promise.race([
				serviceWorkerRegistrationPromise.then((registration) => {
					if (registration != null) {
						return Promise.reject(new Error('Service worker already exists.'));
					}
					return registration;
				}).then(() => engine.installServiceWorker()),
				// For some reason, `getRegistration()` can stall
				new Promise((resolve) => {
					setTimeout(() => resolve(), 2000);
				}),
			]).then(() => {
				// Reload if there was no error.
				window.location.reload();
			}).catch((err) => {
				console.error('Error while registering service worker:', err);
			});
		} else {
			// Display the message as usual
			const missingMsg = 'Error\nThe following features required to run Godot projects on the Web are missing:\n';
			displayFailureNotice(missingMsg + missing.join('\n'));
		}
	} else {
		setStatusMode('progress');
		engine.startGame({
			'onProgress': function (current, total) {
				if (current > 0 && total > 0) {
					window.__alxLoad(current / total);
					statusPercent.textContent = Math.min(100, Math.floor(current / total * 100)) + '%';
				} else {
					window.__alxLoad(-1);
					statusPercent.textContent = '';
				}
			},
		}).then(() => {
			window.__alxStarted();
			setStatusMode('hidden');
		}, displayFailureNotice);
	}
}());
