; Export presets used by CI (.github/workflows/godot.yml) and scripts/godot/export.sh.
; Web only for now; Android and iOS presets are added when those builds start.

[preset.0]

name="Web"
platform="Web"
runnable=true
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter="data/*.json"
exclude_filter="tests/*, brand/intro_still.jpg"
export_path="../build/web/index.html"

[preset.0.options]

variant/extensions_support=false
variant/thread_support=false
; Empty: the stock template. scripts/godot/export.sh fills it from GODOT_WEB_TEMPLATE for one export.
custom_template/release=""
vram_texture_compression/for_desktop=true
vram_texture_compression/for_mobile=true
html/custom_html_shell="res://web/shell.html"
html/canvas_resize_policy=2
html/focus_canvas_on_start=true
progressive_web_app/enabled=false
