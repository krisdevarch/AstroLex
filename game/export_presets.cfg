; Export presets used by CI (.github/workflows/godot.yml) and scripts/godot/export.sh.
; Web, plus iOS (WP-3.0). The iOS preset exports an Xcode project only; it carries no account
; detail: scripts/ios/ship-testflight.sh passes the team, bundle ID and version to xcodebuild
; from scripts/ios/.env.local. 0000000000 is a placeholder Godot needs to export at all.

[preset.0]

name="Web"
platform="Web"
runnable=true
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter="data/*.json"
exclude_filter="tests/*"
export_path="../build/web/index.html"

[preset.0.options]

variant/extensions_support=false
variant/thread_support=false
vram_texture_compression/for_desktop=true
vram_texture_compression/for_mobile=true
html/canvas_resize_policy=2
html/focus_canvas_on_start=true
progressive_web_app/enabled=false

[preset.1]

name="iOS"
platform="iOS"
runnable=false
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter="data/*.json"
exclude_filter="tests/*"
export_path="../build/ios/AstroLex.xcodeproj"

[preset.1.options]

application/export_project_only=true
application/app_store_team_id="0000000000"
application/bundle_identifier="com.example.astrolex"
application/short_version="0.1.0"
application/version="1"
application/targeted_device_family=0
application/min_ios_version="15.0"
application/code_sign_identity_debug="Apple Development"
application/code_sign_identity_release="Apple Development"
